UPSTREAM_URL=https://github.com/frknkrc44/HMA-OSS.git
UPSTREAM_BRANCH=future
ZIP_PREFIX=HMA-OSS-ZYGISK
# upstream oss-175: 607 commits + 0x6f7373
VERSION_CODE_FLOOR=7304658
# upstream .github/workflows/main.yml: JDK 21, submodules, prebuild, :app:assemble,
# :zygote:assemble -> zygote/build/outputs/magisk/release/*.zip (manager.apk inside,
# its signing cert pinned in the module). versionCode counts refs/remotes/origin/master:
# here that ref is the merged HEAD, so future commits raise it.
build() {
    for v in SIGN_KEYSTORE_B64 SIGN_KEY_ALIAS SIGN_STORE_PASSWORD SIGN_KEY_PASSWORD; do
        [ -n "${!v}" ] || { echo "$v is not set: refusing a debug-signed build" >&2; return 1; }
    done
    git submodule update -q --init --recursive >&2
    git update-ref refs/remotes/origin/master HEAD
    # in-app update check (UpdateInfo.kt reads tag_name/body/html_url, offers an update when
    # tag_name != BuildConfig.VERSION_NAME): this fork's .forgejo/app-update.json. Workspace only;
    # assume-unchanged keeps the edit out of the version name's "+N" dirty count.
    f=app/src/main/java/icu/nullptr/hidemyapplist/data/AppConstants.kt
    grep -q '"https://api.github.com/repos/frknkrc44/HMA-OSS/releases/latest"' "$f" || { echo "UPDATE_CHECK_URL not found" >&2; return 1; }
    sed -i "s|\"https://api.github.com/repos/frknkrc44/HMA-OSS/releases/latest\"|\"$SERVER_URL/$REPOSITORY/raw/branch/main/.forgejo/app-update.json\"|" "$f"
    git update-index --assume-unchanged "$f"
    printf '%s' "$SIGN_KEYSTORE_B64" | base64 -d > "$HOME/key.jks"
    printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nfileDir=%s\n' \
        "$SIGN_STORE_PASSWORD" "$SIGN_KEY_ALIAS" "$SIGN_KEY_PASSWORD" "$HOME/key.jks" > local.properties
    export JAVA_HOME="$JAVA_HOME_21"
    chmod +x gradlew
    ./gradlew --no-daemon prebuild >&2
    ./gradlew --no-daemon :app:assemble >&2
    ./gradlew --no-daemon :zygote:assemble >&2
    mv zygote/build/outputs/magisk/release/*.zip "$OUT/module.zip"
}

# release step: the feed the app reads; tag_name is the app's VERSION_NAME (the built module.prop
# version), html_url the module zip (it installs the manager APK)
release_files() {
    python3 -I - .forgejo/app-update.json "$BUILT_VERSION" "$VERSION" "$BODY" "$ZIP_URL" <<'PY'
import json, sys
path, app_version, version, body, zip_url = sys.argv[1:]
json.dump({"tag_name": app_version, "name": "HMA-OSS " + version, "body": body, "html_url": zip_url},
          open(path, "w"), indent=2)
open(path, "a").write("\n")
PY
    RELEASE_FILES=".forgejo/app-update.json"
}
